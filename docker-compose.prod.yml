# Production overlay. On the VPS, .env sets COMPOSE_FILE=docker-compose.yml:docker-compose.prod.yml,
# HTTP_PORT=127.0.0.1:80 and IMAGE_TAG (the deployed commit), so only HTTPS (443) is public and it
# only answers Cloudflare. Images are built by GitHub Actions and pulled from GHCR.
services:
  api:
    image: ghcr.io/willassistantt-svg/personae-api:${IMAGE_TAG:-latest}

  frontend:
    image: ghcr.io/willassistantt-svg/personae-frontend:${IMAGE_TAG:-latest}

  nginx:
    ports:
      - "443:443"
    volumes:
      - ./nginx/nginx.prod.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/cloudflare.conf:/etc/nginx/cloudflare.conf:ro
      - /etc/personae/tls:/etc/personae/tls:ro
