events {}

http {
    client_max_body_size 120m;

    upstream personae_frontend {
        server frontend:4317;
    }

    upstream personae_api {
        server api:8091;
    }

    server {
        listen 80;
        server_name thepersonae.com www.thepersonae.com;

        location /api/ {
            proxy_pass http://personae_api;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_read_timeout 120s;
        }

        location /actuator/ {
            proxy_pass http://personae_api;
            proxy_set_header Host $host;
        }

        location / {
            proxy_pass http://personae_frontend;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }
}
