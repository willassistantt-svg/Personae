events {}

http {
    client_max_body_size 120m;
    client_body_timeout 120s;
    proxy_read_timeout 120s;
    proxy_send_timeout 120s;
    server_tokens off;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript image/svg+xml;

    include /etc/nginx/cloudflare.conf;

    upstream personae_frontend {
        server frontend:4317;
    }

    upstream personae_api {
        server api:8091;
    }

    # Port 80 is published on 127.0.0.1 only: deploy health checks from the VPS itself.
    server {
        listen 80 default_server;
        server_name _;

        location /api/ {
            proxy_pass http://personae_api;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto http;
        }

        location / {
            proxy_pass http://personae_frontend;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto http;
        }
    }

    server {
        listen 443 ssl default_server;
        http2 on;
        server_name personae.men www.personae.men;

        ssl_certificate /etc/personae/tls/origin.pem;
        ssl_certificate_key /etc/personae/tls/origin.key;
        ssl_protocols TLSv1.2 TLSv1.3;

        if ($from_cloudflare = 0) {
            return 444;
        }

        add_header Strict-Transport-Security "max-age=31536000" always;
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
        add_header X-Frame-Options SAMEORIGIN always;

        location /actuator/ {
            return 404;
        }

        location /api/ {
            proxy_pass http://personae_api;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-Proto https;
        }

        location / {
            proxy_pass http://personae_frontend;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-Proto https;
        }
    }
}
