name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: personae-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Publish on the VPS
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          VPS_PORT: ${{ secrets.VPS_PORT }}
          VPS_PATH: ${{ secrets.VPS_PATH }}
        run: |
          if [ -z "$VPS_HOST" ] || [ -z "$VPS_USER" ] || [ -z "$VPS_SSH_KEY" ]; then
            echo "Segredos da VPS ainda não existem. O deploy fica pronto e só publica quando VPS_HOST, VPS_USER e VPS_SSH_KEY estiverem no repositório."
            exit 0
          fi
          install -m 700 -d ~/.ssh
          printf '%s\n' "$VPS_SSH_KEY" > ~/.ssh/personae
          chmod 600 ~/.ssh/personae
          ssh -i ~/.ssh/personae \
            -p "${VPS_PORT:-22}" \
            -o StrictHostKeyChecking=accept-new \
            "$VPS_USER@$VPS_HOST" \
            "VPS_PATH='${VPS_PATH:-/opt/personae}' bash -s" < deploy/remote-up.sh
