name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: personae-production
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  ci:
    uses: ./.github/workflows/ci.yml

  images:
    name: Imagem ${{ matrix.service }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        include:
          - service: api
            context: backend
          - service: frontend
            context: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v7
        with:
          context: ${{ matrix.context }}
          push: true
          build-args: API_INTERNAL_URL=http://api:8091
          tags: |
            ghcr.io/willassistantt-svg/personae-${{ matrix.service }}:${{ github.sha }}
            ghcr.io/willassistantt-svg/personae-${{ matrix.service }}:latest
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}

  deploy:
    name: Publicar na VPS
    needs: [ci, images]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      packages: read
    environment:
      name: production
      url: https://personae.men
    steps:
      - uses: actions/checkout@v7

      - name: Publicar ${{ github.sha }}
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          VPS_PORT: ${{ secrets.VPS_PORT }}
          VPS_PATH: ${{ secrets.VPS_PATH }}
          VPS_KNOWN_HOSTS: ${{ secrets.VPS_KNOWN_HOSTS }}
          REGISTRY_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ -z "$VPS_HOST" ] || [ -z "$VPS_USER" ] || [ -z "$VPS_SSH_KEY" ]; then
            echo "::error::Faltam os secrets VPS_HOST, VPS_USER ou VPS_SSH_KEY."
            exit 1
          fi
          install -m 700 -d ~/.ssh
          printf '%s\n' "$VPS_SSH_KEY" > ~/.ssh/personae
          chmod 600 ~/.ssh/personae
          if [ -n "$VPS_KNOWN_HOSTS" ]; then
            printf '%s\n' "$VPS_KNOWN_HOSTS" > ~/.ssh/known_hosts
            hostcheck=yes
          else
            hostcheck=accept-new
          fi
          # Credentials travel on stdin, never on the remote command line.
          {
            printf 'export VPS_PATH=%q DEPLOY_SHA=%q REGISTRY_USER=%q REGISTRY_TOKEN=%q\n' \
              "${VPS_PATH:-/opt/personae}" "$GITHUB_SHA" "$GITHUB_ACTOR" "$REGISTRY_TOKEN"
            cat deploy/remote-up.sh
          } | ssh -i ~/.ssh/personae \
            -p "${VPS_PORT:-22}" \
            -o StrictHostKeyChecking=$hostcheck \
            -o ServerAliveInterval=30 \
            "$VPS_USER@$VPS_HOST" "bash -s"

  verify:
    name: Verificar produção
    needs: deploy
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - name: Smoke test em https://personae.men
        run: SMOKE_ATTEMPTS=24 bash deploy/smoke.sh https://personae.men
      - name: www responde
        run: |
          code=$(curl -s -o /dev/null -w '%{http_code}' --max-time 20 https://www.personae.men/)
          echo "www.personae.men -> $code"
          case "$code" in 200|301|302|308) ;; *) exit 1 ;; esac
