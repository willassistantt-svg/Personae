name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: personae-production
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  ci:
    uses: ./.github/workflows/ci.yml

  deploy:
    name: Publicar na VPS
    needs: ci
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment:
      name: production
      url: https://personae.men
    steps:
      - uses: actions/checkout@v4

      - name: Publicar ${{ github.sha }}
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          VPS_PORT: ${{ secrets.VPS_PORT }}
          VPS_PATH: ${{ secrets.VPS_PATH }}
          VPS_KNOWN_HOSTS: ${{ secrets.VPS_KNOWN_HOSTS }}
        run: |
          if [ -z "$VPS_HOST" ] || [ -z "$VPS_USER" ] || [ -z "$VPS_SSH_KEY" ]; then
            echo "::error::Faltam os secrets VPS_HOST, VPS_USER ou VPS_SSH_KEY."
            exit 1
          fi
          install -m 700 -d ~/.ssh
          printf '%s\n' "$VPS_SSH_KEY" > ~/.ssh/personae
          chmod 600 ~/.ssh/personae
          if [ -n "$VPS_KNOWN_HOSTS" ]; then
            printf '%s\n' "$VPS_KNOWN_HOSTS" > ~/.ssh/known_hosts
            hostcheck=yes
          else
            hostcheck=accept-new
          fi
          ssh -i ~/.ssh/personae \
            -p "${VPS_PORT:-22}" \
            -o StrictHostKeyChecking=$hostcheck \
            -o ServerAliveInterval=30 \
            "$VPS_USER@$VPS_HOST" \
            "VPS_PATH='${VPS_PATH:-/opt/personae}' DEPLOY_SHA='${{ github.sha }}' bash -s" < deploy/remote-up.sh

  verify:
    name: Verificar produção
    needs: deploy
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Smoke test em https://personae.men
        run: SMOKE_ATTEMPTS=24 bash deploy/smoke.sh https://personae.men
      - name: www redireciona ou responde
        run: |
          code=$(curl -s -o /dev/null -w '%{http_code}' --max-time 20 https://www.personae.men/)
          echo "www.personae.men -> $code"
          case "$code" in 200|301|302|308) ;; *) exit 1 ;; esac
